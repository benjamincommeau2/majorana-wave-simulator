# This file is the Cargo manifest for the Majorana Wave Simulator.
#
# Its responsibilities include:
# - Defining the Rust package name, version, and language edition.
# - Telling Cargo what kind of library to build.
# - Listing the external crates used by the project.
# - Configuring dependencies needed for WebAssembly, browser APIs, and WebGPU.
#
# Cargo reads this file when building, testing, or running project-related commands.
# The generated build output goes into /target/, which is ignored by Git.

[package] # Starts the section that describes our Rust project.

name = "majorana-wave-simulator" # Gives this Rust project its Cargo package name.

version = "0.1.0" # Sets the current version number of this Rust project.
# major.minor.patch

edition = "2024" # Tells Rust which language edition and syntax rules this project uses.

[lib] # Starts the section that describes the Rust library we want Cargo to build.

crate-type = ["cdylib", "rlib"] # Builds WebAssembly-compatible output with `cdylib` and a normal Rust library with `rlib` so integration tests can import this crate.

[dependencies] # Starts the section where we list external Rust libraries this project uses.

wasm-bindgen = "0.2" # Adds wasm-bindgen, which lets Rust communicate with JavaScript and browser APIs.

console_error_panic_hook = "0.1" # Makes Rust crash messages easier to read in the browser console.

web-sys = { version = "0.3", features = [ # Gives Rust access only to the browser API types currently needed by the application.
  "Document", # Enables Rust access to the browser document.

  "Element", # Enables Rust access to generic HTML elements.

  "EventTarget", # Enables browser event listeners such as mouse-down, mouse-move, and mouse-up handlers.

  "HtmlCanvasElement", # Enables Rust access to the dedicated WebGPU rendering canvas.

  "MouseEvent", # Enables Rust to read mouse-button and mouse-position information while the user drags the cube.

  "Window", # Enables Rust access to the browser window and animation-frame scheduling.

    "Blob",
  "BlobEvent",
  "HtmlElement",
  "MediaRecorder",
  "MediaRecorderOptions",
  "MediaStream",
  "Url",
  "HtmlInputElement",
  
] } # Finishes the selected web-sys browser features.

wgpu = "30.0" # Adds wgpu, the Rust graphics library that can use browser WebGPU when compiled to WebAssembly.

wasm-bindgen-futures = "0.4" # Lets our browser-based Rust code wait for asynchronous operations such as requesting a GPU adapter.

bytemuck = "1" # Adds safe helpers for viewing our typed f32 state as raw bytes when transferring it to WebGPU.
libm = "0.2.16"

[dev-dependencies] # Starts dependencies used only while compiling and running tests.

pollster = "1.0" # Lets the native GPU integration test wait for wgpu's asynchronous adapter and device requests.
