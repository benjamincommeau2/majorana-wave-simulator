<!--
This file is the browser entry point for the Majorana Wave Simulator.

Its responsibilities include:
- Defining the basic webpage structure.
- Providing HTML elements that Rust can access and update.
- Telling Trunk to compile and load the Rust WebAssembly application.
- Acting as the browser shell around the Rust/WebGPU simulator.

The simulation logic itself belongs in Rust rather than in this HTML file.
-->

<!doctype html>

<html lang="en">

  <head>

    <meta charset="UTF-8">

    <title>Majorana Wave Simulator</title>

    <link data-trunk rel="rust">

  </head>

  <body>

    <h1>Majorana WebGPU Wave Simulator</h1>

    <pre id="status">Starting Rust...</pre>

    <p>
      <strong>Requirements:</strong>
      WebGPU-capable browser with hardware acceleration enabled.
      This simulator currently has no software fallback.
    </p>

    <p id="interaction-instructions">
      Click and drag to rotate the spatial Majorana field.
    </p>

    <div
      id="simulator-controls"
      style="
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-start;
        margin: 12px 0;
      "
    ></div>

    <canvas
      id="render-canvas"
      width="640"
      height="640"
      aria-label="WebGPU Majorana field visualization"
      style="border: 1px solid black;"
    ></canvas>

  </body>

</html>
